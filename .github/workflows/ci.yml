name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sandsd01_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sandsd01_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

  game-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this is the type check as
      # well as the bundle. It matters that it is one command: when `tsc` fails,
      # `vite build` never runs and `dist/` is left holding the *previous*
      # build — which looks like a success to anything that only checks whether
      # the directory exists.
      - run: npm run build

  game-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - run: npm ci
      - run: npm run build

      # `game-build` proves the game compiles. It cannot prove the game runs:
      # a bundle that throws on load builds perfectly. These four suites open
      # the real thing in a real browser, and each one exits non-zero when it
      # fails — unlike `buttoncheck`, `costcheck`, `fontcheck` and
      # `shadowcheck`, which print measurements and always exit 0, so they
      # would cost time here and gate nothing.
      #
      # Deliberately a subset. The full 28 take about half an hour, which is
      # not a per-PR gate; game/README.md covers running them all.
      - name: Install the browser
        working-directory: game/checks
        run: |
          # The install is explicit rather than left to playwright's
          # postinstall, which would otherwise fetch every browser it ships
          # with when only chromium is driven here.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
          npx playwright install --with-deps chromium

      - name: Smoke the built game
        working-directory: game/checks
        env:
          # A bundle that never boots fails the first suite in seconds; without
          # this the three after it sit out their timeouts waiting for a game
          # that is not coming.
          CHECK_BAIL: "1"
        run: node run.mjs smoke-check worldcheck edgecheck leftoverscheck

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds the production image and boots it against a throwaway Postgres,
      # so a broken Dockerfile fails here rather than at deploy time.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Postgres
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=pos -p 5432:5432 postgres:16
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres && break
            sleep 2
          done

      - name: Boot the image and check it serves
        run: |
          docker run -d --name pos --network host \
            -e DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/pos" \
            -e JWT_SECRET="$(head -c 32 /dev/urandom | base64 | tr -d '=+/' | head -c 40)" \
            pos:ci

          # The container runs migrations before listening, so poll rather than sleep.
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then
              echo "container healthy"
              curl -sf http://127.0.0.1:3000/ | head -c 200; echo
              # The SPA must be served from the image, not just the API.
              curl -sf http://127.0.0.1:3000/pos | grep -q "<div id=\"root\">" \
                && echo "SPA served OK" && exit 0
              echo "SPA not served"; exit 1
            fi
            sleep 2
          done
          echo "container never became healthy"; docker logs pos; exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs pos || true
